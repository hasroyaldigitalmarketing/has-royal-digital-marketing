<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - HAS Royal Digital Marketing</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --text-dark: #0f172a;
            --text-light: #475569;
            --bg-light: #f8fafc;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .thank-you-card {
            background: #ffffff;
            max-width: 520px;
            width: 100%;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .thank-you-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #2563eb, #10b981);
        }
        /* Support Agent Icon Styling */
        .support-avatar {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px auto;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
        }
        .support-avatar svg {
            width: 45px;
            height: 45px;
            fill: var(--primary);
        }
        /* Online Status Dot */
        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background-color: var(--success);
            border: 3px solid #ffffff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        h1 {
            font-size: 26px;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 700;
        }
        .highlight-text {
            color: var(--primary);
        }
        p {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 25px;
        }
        /* Callout Box for 5 Min Notice */
        .callback-box {
            background: #f0fdf4;
            border: 1px dashed #bbf7d0;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #166534;
            font-size: 14px;
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #ffffff;
            padding: 13px 30px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <!-- Professional Support / Customer Care Lady Icon -->
        <div class="support-avatar">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
            <div class="status-dot"></div>
        </div>

        <h1>Thank You! <span class="highlight-text">Aapka Form Mil Gaya Hai</span></h1>
        
<p>Humein aapki request mil chuki hai. Hamari team aapki zaroorat ke mutabiq best solution ke sath aapse turant jud rahi hai.</p>

        <!-- 5 Minutes Callback Box -->
        <div class="callback-box">
            ⚡ Please wait! Hamari team agle <strong>5 minutes</strong> mein aapko call back karegi.
        </div>

        <a href="index.html" class="btn">← Back to Home Page</a>
    </div>

</body>
</html>
